<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 1 - Đăng ký tài khoản</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    /* a. Form bo góc 10px, nền #e0f2fe, hover nổi nhẹ với shadow #E0FEF2 */
    .register-form {
      background-color: #e0f2fe;
      border-radius: 10px;
      width: 360px;
      padding-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
      overflow: hidden;
    }
    .register-form:hover {
      box-shadow: 0 8px 16px #E0FEF2;
      transform: translateY(-2px);
    }
    .form-header {
      background-color: #38bdf8;
      color: white;
      text-align: center;
      padding: 12px 0;
      font-weight: bold;
      font-size: 14px;
    }
    .form-body {
      padding: 15px 25px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-size: 11px;
      color: #64748b;
      margin-bottom: 4px;
    }
    /* b. Trường input viền dày 4px màu #94B8A3, focus đổi #A3B894 và viền sáng mờ #bfdbfe */
    .form-group input {
      width: 100%;
      padding: 8px 10px;
      border: 4px solid #94B8A3;
      border-radius: 4px;
      outline: none;
      font-size: 13px;
      transition: all 0.2s ease;
    }
    .form-group input:focus {
      border-color: #A3B894;
      box-shadow: 0 0 8px #bfdbfe;
    }
    /* c. Nút hoàn tất màu nền #6366f1, hover #4f46e5, active #3730a3 dịch lên 4px & giảm shadow */
    .btn-submit {
      width: 100%;
      background-color: #6366f1;
      color: white;
      border: none;
      padding: 10px;
      font-weight: bold;
      font-size: 11px;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      transition: all 0.2s ease;
      margin-top: 10px;
      text-transform: uppercase;
    }
    .btn-submit:hover {
      background-color: #4f46e5;
    }
    .btn-submit:active {
      background-color: #3730a3;
      transform: translateY(-4px);
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <form class="register-form">
    <div class="form-header">Đăng ký tài khoản</div>
    <div class="form-body">
      <!-- 1. Yêu cầu HTML: Các trường Tên đăng nhập, email, mật khẩu, số điện thoại, họ và tên là bắt buộc -->
      <div class="form-group">
        <label>Tên đăng nhập *</label>
        <input type="text" name="username" required>
      </div>
      <div class="form-group">
        <label>Họ và tên *</label>
        <input type="text" name="fullname" required>
      </div>
      <div class="form-group">
        <label>Email *</label>
        <input type="email" name="email" required>
      </div>
      <div class="form-group">
        <label>Mật khẩu *</label>
        <input type="password" name="password" required>
      </div>
      <div class="form-group">
        <label>Xác nhận mật khẩu</label>
        <input type="password" name="confirm_password">
      </div>
      <div class="form-group">
        <label>Số điện thoại *</label>
        <input type="tel" name="phone" required>
      </div>
      <div class="form-group">
        <label>Nhập địa chỉ</label>
        <input type="text" name="address">
      </div>
      <button type="submit" class="btn-submit">TẠO TÀI KHOẢN</button>
    </div>
  </form>

</body>
</html>
